name: Pakete veröffentlichen

# Veröffentlicht beide Pakete — @conciso/design-system (CSS-Schicht) und
# @conciso/design-system-angular (Angular-Lib) — nach GitHub Packages, im Lockstep
# mit derselben Versionsnummer (siehe CONTEXT.md, docs/adr/0004).
#
# AUSLÖSER: jeder Push auf main. Ob und welche Version veröffentlicht wird, ermittelt der
# Job „pruefen“ über die COMMITS, nicht über einen Versionswechsel in package.json — das
# Repo ist versionsfrei (docs/adr/0008-release-ausloesung-und-versionsquelle.md): beide
# package.json tragen dauerhaft den Platzhalter 0.0.0. `semantic-release --dry-run` wertet
# die Commits seit dem letzten Tag aus (nur veröffentlichungsrelevante zählen, siehe
# scripts/release/relevant-paths.mjs) und liefert Version und Notizen. Gibt es kein
# veröffentlichungsrelevantes `feat`/`fix`/`perf`/`build(deps)`/Breaking-Change seit dem
# letzten Tag, bleibt die Version leer — der Lauf endet still.
#
# Damit gilt: ein Commit mit passendem Typ auf main ist das Release. Es gibt keinen
# Knopf, den man vergessen kann. Wer vorher trocken prüfen will, startet den Workflow
# manuell (workflow_dispatch) — der Default dort ist ein Dry-Run für Publish/Tag/Release;
# die Versionsermittlung selbst läuft immer als semantic-release-Dry-Run (kein Plugin dort
# veröffentlicht oder taggt, das bleibt Aufgabe dieses Workflows, siehe release.config.mjs).
#
# KEIN `release: published`-Trigger: Dieser Workflow ERZEUGT Tag und Release selbst
# (die CHANGELOG-Konvention verlangt den Tag `vX.Y.Z`, ab 2.0.0 tragen GitHub-Releases die
# Notes). Mit dem Trigger würde er sich durch sein eigenes Release rekursiv erneut auslösen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run (kein echtes npm publish, kein Tag, kein Release)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  # Nicht pro Ref, sondern global: zwei gleichzeitige Publishes wären in jedem Fall
  # falsch. Ein laufender Publish wird NICHT abgebrochen — ein halb veröffentlichtes
  # Paket-Paar wäre schlimmer als ein Warten auf den nächsten Lauf.
  group: publish
  cancel-in-progress: false

jobs:
  # ── Vorprüfung: gibt es überhaupt etwas zu veröffentlichen? ──────────────────
  # Bewusst ein eigener, billiger Job: er entscheidet, ob der Smoke-Test und der
  # Publish-Job überhaupt anlaufen. So kostet ein Push ohne veröffentlichungsrelevante
  # Commits seit dem letzten Tag nur wenige Sekunden.
  pruefen:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      # Aus `ermitteln`, nicht direkt aus der Engine: beim Nachholen einer abgebrochenen
      # Finalisierung kommt die Version aus dem letzten Tag, nicht aus der Engine.
      version: ${{ steps.ermitteln.outputs.version }}
      notes: ${{ steps.ermitteln.outputs.notes }}
      source_sha: ${{ steps.ermitteln.outputs.source_sha }}
      publish: ${{ steps.ermitteln.outputs.publish }}
      publish_css: ${{ steps.ermitteln.outputs.publish_css }}
      publish_lib: ${{ steps.ermitteln.outputs.publish_lib }}
      dry: ${{ steps.ermitteln.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle History + Tags: semantic-release muss den letzten vX.Y.Z-Tag finden und
          # alle Commits seit dort auswerten können.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@conciso'
      - name: Dependencies installieren
        run: npm ci
      # Berechnet Version + Notizen aus den Commits seit dem letzten Tag (siehe
      # release.config.mjs, scripts/release/semantic-release-plugin.mjs). Läuft IMMER als
      # Dry-Run: kein Plugin hier veröffentlicht, taggt oder erstellt ein GitHub-Release,
      # das übernimmt der `publish`-Job weiter unten. Schreibt die Version bei Bedarf nach
      # $GITHUB_OUTPUT (scripts/release/write-release-outputs.mjs) und die Notizen als Datei
      # (release-notes-generated.md), die per Artefakt an den `publish`-Job weitergereicht wird.
      - name: 'Engine: Version und Notizen aus den Commits ermitteln'
        id: engine
        run: npx semantic-release --dry-run --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Entscheiden, ob veröffentlicht wird
        id: ermitteln
        run: |
          VERSION="${{ steps.engine.outputs.version }}"
          NOTES=true

          if [ -z "$VERSION" ]; then
            # Die Engine meldet nichts Neues. Das heißt aber nur: seit dem letzten Tag kam
            # kein relevanter Commit. Brach ein früherer Lauf NACH dem Tag-Push, aber VOR
            # `gh release create` ab, ist genau dieser letzte Tag unfertig — und die Engine
            # sieht ihn als abgeschlossen an. Deshalb den letzten Tag selbst prüfen und bei
            # fehlendem GitHub-Release die Finalisierung nachholen. Die Engine rechnet ab
            # diesem Tag und kann die Notes nicht mehr erzeugen — sie stehen aber als
            # Nachricht im annotierten Tag (siehe „Tag setzen“ unten) und werden von dort
            # wiederverwendet: dieselben pfadgefilterten Notes wie im regulären Lauf.
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ] && ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
              VERSION="${LATEST_TAG#v}"
              # Nur ein annotierter Tag trägt Notes; bei einem leichtgewichtigen Tag lieferte
              # %(contents) stattdessen die Commit-Nachricht.
              if [ "$(git cat-file -t "$LATEST_TAG")" = "tag" ]; then
                git tag -l --format='%(contents)' "$LATEST_TAG" > release-notes-generated.md
              fi
              if [ -s release-notes-generated.md ]; then NOTES=true; else NOTES=false; fi
              echo "::warning::Tag ${LATEST_TAG} existiert, das GitHub-Release dazu fehlt — ein vorheriger Lauf brach bei der Finalisierung ab. Wird nachgeholt (Notes aus dem Tag: ${NOTES})."
            else
              echo "::notice::Kein veröffentlichungsrelevanter Commit seit dem letzten Tag — kein Release."
              echo "publish=false"     >> "$GITHUB_OUTPUT"
              echo "publish_css=false" >> "$GITHUB_OUTPUT"
              echo "publish_lib=false" >> "$GITHUB_OUTPUT"
              echo "dry=false"         >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Ermittelte Version: ${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES"     >> "$GITHUB_OUTPUT"

          # Dry-Run nur beim manuellen Start, und dort als Default.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            DRY=true
          else
            DRY=false
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          # Quellstand, aus dem gebaut und getaggt wird: standardmäßig der ausgelöste
          # Commit, nur das Nachziehen eines halben Releases setzt ihn weiter unten um.
          # Per trap genau einmal geschrieben, egal über welches `exit` das Skript endet.
          SOURCE_SHA="${{ github.sha }}"
          trap 'echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"' EXIT

          # Existenz PRO PAKET prüfen, nicht "irgendeines von beiden". Sonst wäre ein
          # halb geglückter Lauf (erstes Paket veröffentlicht, zweites gescheitert)
          # nicht mehr zu heilen: der nächste Push würde still übergehen und das Paar
          # dauerhaft auf verschiedenen Versionen stehen lassen.
          # `npm view` scheitert auch dann, wenn das Paket noch gar nicht existiert —
          # der erwartete Fall vor dem ersten Release, deshalb Fehler geschluckt.
          vorhanden() {
            npm view "$1@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1
          }
          CSS_EXISTS=false; LIB_EXISTS=false
          vorhanden "@conciso/design-system"         && CSS_EXISTS=true
          vorhanden "@conciso/design-system-angular" && LIB_EXISTS=true
          echo "Registry-Stand für ${VERSION}: CSS-Schicht=${CSS_EXISTS}, Angular-Lib=${LIB_EXISTS}"

          # Tag und Release entstehen NACH den Publishes und sind damit der Teil, der
          # eigenständig scheitern kann, während beide Pakete schon liegen. Ohne diese
          # Prüfung wäre genau das nicht mehr zu heilen: der nächste Lauf sähe beide
          # Pakete und überspränge den Job, der die Finalisierung nachholt. Bleibt der
          # Lauf bei genau derselben Version stehen, weil kein neuer Tag entstand, liefert
          # die Engine oben erneut dieselbe Version — die Heilung greift also unverändert.
          # Tag über das Remote prüfen, nicht lokal — actions/checkout holt keine Tags.
          TAG_EXISTS=false; RELEASE_EXISTS=false
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1 && TAG_EXISTS=true
          gh release view "v${VERSION}" >/dev/null 2>&1 && RELEASE_EXISTS=true
          echo "Finalisierung für ${VERSION}: Tag=${TAG_EXISTS}, Release=${RELEASE_EXISTS}"

          if [ "$DRY" = "true" ]; then
            # Ein Dry-Run soll BEIDE Pakete durchspielen, unabhängig vom Registry-Stand.
            echo "publish=true"     >> "$GITHUB_OUTPUT"
            echo "publish_css=true" >> "$GITHUB_OUTPUT"
            echo "publish_lib=true" >> "$GITHUB_OUTPUT"
          elif [ "$CSS_EXISTS" = "true" ] && [ "$LIB_EXISTS" = "true" ]; then
            if [ "$TAG_EXISTS" = "false" ] || [ "$RELEASE_EXISTS" = "false" ]; then
              # Beide Pakete liegen, aber die Finalisierung fehlt → ein vorheriger Lauf
              # brach nach den Publishes ab. Job anlaufen lassen, beide Publishes aber
              # überspringen; der Tag-/Release-Schritt ist idempotent und zieht nach.
              echo "::warning::Version ${VERSION} ist veröffentlicht, aber die Finalisierung fehlt (Tag=${TAG_EXISTS}, Release=${RELEASE_EXISTS}) — wird nachgeholt."
              echo "publish=true"      >> "$GITHUB_OUTPUT"
              echo "publish_css=false" >> "$GITHUB_OUTPUT"
              echo "publish_lib=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Beide liegen, Tag und Release sind da → nichts zu tun.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # Manuell und ausdrücklich ohne Dry-Run angefordert → laut scheitern.
              echo "::error::Version ${VERSION} ist für beide Pakete bereits veröffentlicht."
              exit 1
            fi
            # Push-getrieben, aber die Engine lieferte trotzdem dieselbe Version wie zuvor
            # (kann nicht regulär vorkommen, da ein neuer Tag entstehen würde) → still
            # übergehen statt erneut zu veröffentlichen.
            echo "::notice::Version ${VERSION} ist bereits veröffentlicht — nichts zu tun."
            echo "publish=false"     >> "$GITHUB_OUTPUT"
            echo "publish_css=false" >> "$GITHUB_OUTPUT"
            echo "publish_lib=false" >> "$GITHUB_OUTPUT"
          else
            # Mindestens eines fehlt → veröffentlichen, aber nur das Fehlende. Liegt
            # genau eines schon, war ein vorheriger Lauf auf halber Strecke stehen
            # geblieben: laut sagen und den Rest nachziehen (der Lauf heilt sich
            # selbst, statt den Lockstep dauerhaft zu brechen).
            if [ "$CSS_EXISTS" = "true" ] || [ "$LIB_EXISTS" = "true" ]; then
              echo "::warning::Unvollständiger Release ${VERSION} gefunden (CSS=${CSS_EXISTS}, Lib=${LIB_EXISTS}) — ein vorheriger Lauf brach zwischen den Publishes ab. Es wird nur das fehlende Paket nachgezogen."
              # Das fehlende Paket muss aus DEMSELBEN Quellstand gebaut werden wie das
              # vorhandene, sonst tragen die Lockstep-Pakete dieselbe Version, aber
              # verschiedene Inhalte — ist seit dem abgebrochenen Lauf ein weiterer Commit
              # auf main gelandet, wäre der aktuelle Checkout der falsche. npm vermerkt beim
              # Publish den Commit als `gitHead`; von dort wird gebaut (und getaggt).
              if [ "$CSS_EXISTS" = "true" ]; then VORHANDEN="@conciso/design-system"; else VORHANDEN="@conciso/design-system-angular"; fi
              SOURCE_SHA=$(npm view "${VORHANDEN}@${VERSION}" gitHead --registry=https://npm.pkg.github.com 2>/dev/null || true)
              if [ -z "$SOURCE_SHA" ]; then
                # Ohne bekannten Quellstand lieber laut scheitern als ein Paar mit
                # auseinanderlaufendem Inhalt veröffentlichen.
                echo "::error::${VORHANDEN}@${VERSION} hat kein gitHead in der Registry — der Quellstand für das fehlende Paket ist unbekannt. Manuell nachziehen."
                exit 1
              fi
              echo "Fehlendes Paket wird aus ${SOURCE_SHA} gebaut (Quellstand von ${VORHANDEN}@${VERSION})."
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            [ "$CSS_EXISTS" = "true" ] && echo "publish_css=false" >> "$GITHUB_OUTPUT" || echo "publish_css=true" >> "$GITHUB_OUTPUT"
            [ "$LIB_EXISTS" = "true" ] && echo "publish_lib=false" >> "$GITHUB_OUTPUT" || echo "publish_lib=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nach `ermitteln`, nicht direkt nach der Engine: beim Nachholen einer abgebrochenen
      # Finalisierung stammen die Notes aus dem annotierten Tag, nicht aus der Engine.
      - name: Notizen als Artefakt weiterreichen
        if: steps.ermitteln.outputs.publish == 'true' && steps.ermitteln.outputs.notes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes-generated.md
          retention-days: 1

  # ── Harte Vorbedingung: konsumierbares Artefakt? ────────────────────────────
  # Als reusable Workflow eingebunden (siehe Kommentar in consumer-smoke-test.yml),
  # weil `needs:` nur innerhalb derselben Datei wirkt. Bekommt die ermittelte Version, damit
  # der Smoke-Test das STAMPED Artefakt prüft, nicht den Platzhalter (Spec Regel 8).
  consumer-smoke-test:
    name: Consumer-Smoke-Test (Vorbedingung)
    needs: pruefen
    if: needs.pruefen.outputs.publish == 'true'
    uses: ./.github/workflows/consumer-smoke-test.yml
    with:
      version: ${{ needs.pruefen.outputs.version }}
      # Denselben Quellstand prüfen, der gleich gebaut wird (siehe `source_sha` in `ermitteln`).
      ref: ${{ needs.pruefen.outputs.source_sha }}

  publish:
    name: Beide Pakete bauen und veröffentlichen
    needs: [pruefen, consumer-smoke-test]
    if: needs.pruefen.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # contents: write für Tag und Release, die dieser Job selbst anlegt.
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
      DRY: ${{ needs.pruefen.outputs.dry }}
    steps:
      # Nicht zwingend der ausgelöste Commit: beim Nachziehen eines halben Releases der
      # Quellstand des schon veröffentlichten Pakets (siehe `ermitteln`), damit beide
      # Lockstep-Pakete denselben Inhalt tragen und der Tag auf diesem Stand landet.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pruefen.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@conciso'
      # npm-Workspace (storybook-angular + angular-lib) → vom Repo-Root installieren.
      - name: Dependencies installieren
        run: npm ci
      # Schreibt die ermittelte Version in beide package.json + die Peer-Pin der Lib
      # (Spec Regel 7). NIE committet — nur der Checkout dieses Runs trägt sie.
      - name: Version in die Artefakte stempeln
        run: node scripts/release/stamp-version.mjs "$VERSION"
      - name: CSS-Schicht bauen (@conciso/design-system)
        run: npm run build
      - name: Angular-Lib bauen (@conciso/design-system-angular)
        run: npm run build --workspace=angular-lib
      - name: Dry-Run-Flag bestimmen
        id: mode
        run: |
          if [ "$DRY" = "true" ]; then echo "flag=--dry-run" >> "$GITHUB_OUTPUT";
          else echo "flag=" >> "$GITHUB_OUTPUT"; fi
      # Einzeln konditioniert: beim Nachziehen eines unvollständigen Releases wird
      # nur das fehlende Paket veröffentlicht — ein zweites `npm publish` derselben
      # Version würde sonst mit 409 abbrechen.
      - name: CSS-Schicht veröffentlichen
        if: needs.pruefen.outputs.publish_css == 'true'
        run: npm publish ${{ steps.mode.outputs.flag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Angular-Lib veröffentlichen
        if: needs.pruefen.outputs.publish_lib == 'true'
        working-directory: angular-lib/dist/design-system-angular
        run: npm publish ${{ steps.mode.outputs.flag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release-Notizen herunterladen
        if: env.DRY == 'false' && needs.pruefen.outputs.notes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      # Der Tag macht die Konvention aus dem CHANGELOG wahr („Releases werden als
      # Git-Tags vX.Y.Z markiert“) — ohne ihn zeigt nichts im Repo auf die
      # veröffentlichte Version. Läuft erst NACH den Publishes: ein Tag auf einem
      # Stand, dessen Veröffentlichung scheiterte, wäre irreführend.
      - name: Tag setzen und Release veröffentlichen
        if: env.DRY == 'false'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VERSION} existiert bereits — wird nicht neu gesetzt."
          else
            # Annotierter Tag mit den Release-Notes als Nachricht: Scheitert gleich danach
            # `gh release create`, holt der nächste Lauf das Release mit genau diesen
            # (pfadgefilterten) Notes nach, statt sie neu erzeugen zu müssen (siehe
            # `ermitteln`). Ein annotierter Tag braucht eine Identität. `--cleanup=verbatim`
            # ist Pflicht: der Standard „strip“ löscht jede Zeile, die mit # beginnt — also
            # sämtliche Markdown-Überschriften der Notes.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -s release-notes-generated.md ]; then
              git tag -a "v${VERSION}" --cleanup=verbatim -F release-notes-generated.md
            else
              git tag -a "v${VERSION}" -m "v${VERSION}"
            fi
            git push origin "v${VERSION}"
          fi
          # Beim Nachziehen eines unvollständigen Releases kann das Release schon
          # existieren — dann nicht scheitern.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} existiert bereits — wird nicht neu erstellt."
          elif [ -f release-notes-generated.md ]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-notes-generated.md
          else
            # Letzter Rückfall, nur beim Nachholen für einen Tag ohne gespeicherte Notes
            # (leichtgewichtiger Tag aus der Zeit vor ADR-0008): GitHub erzeugt die Notes
            # aus den Commits seit dem vorherigen Tag — ungefiltert, aber besser als keine.
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
