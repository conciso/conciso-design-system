name: Pakete veröffentlichen

# Veröffentlicht beide Pakete — @conciso/design-system (CSS-Schicht) und
# @conciso/design-system-angular (Angular-Lib) — nach GitHub Packages, im Lockstep
# mit derselben Versionsnummer (siehe CONTEXT.md, docs/adr/0004).
#
# AUSLÖSER: jeder Push auf main. Ob und welche Version veröffentlicht wird, ermittelt der
# Job „pruefen“ über die COMMITS, nicht über einen Versionswechsel in package.json — das
# Repo ist versionsfrei (docs/adr/0010-release-ausloesung-und-versionsquelle.md): beide
# package.json tragen dauerhaft den Platzhalter 0.0.0. `semantic-release --dry-run` wertet
# die Commits seit dem letzten Tag aus (nur veröffentlichungsrelevante zählen, siehe
# scripts/release/relevant-paths.mjs) und liefert Version und Notizen. Gibt es kein
# veröffentlichungsrelevantes `feat`/`fix`/`perf`/`build(deps)`/Breaking-Change seit dem
# letzten Tag, bleibt die Version leer — der Lauf endet still.
#
# Damit gilt: ein Commit mit passendem Typ auf main ist das Release. Es gibt keinen
# Knopf, den man vergessen kann. Wer vorher trocken prüfen will, startet den Workflow
# manuell (workflow_dispatch) — der Default dort ist ein Dry-Run für Publish/Tag/Release;
# die Versionsermittlung selbst läuft immer als semantic-release-Dry-Run (kein Plugin dort
# veröffentlicht oder taggt, das bleibt Aufgabe dieses Workflows, siehe release.config.mjs).
#
# KEIN `release: published`-Trigger: Dieser Workflow ERZEUGT Tag und Release selbst
# (die CHANGELOG-Konvention verlangt den Tag `vX.Y.Z`, ab 2.0.0 tragen GitHub-Releases die
# Notes). Mit dem Trigger würde er sich durch sein eigenes Release rekursiv erneut auslösen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run (kein echtes npm publish, kein Tag, kein Release)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  # Nicht pro Ref, sondern global: zwei gleichzeitige Publishes wären in jedem Fall
  # falsch. Ein laufender Publish wird NICHT abgebrochen — ein halb veröffentlichtes
  # Paket-Paar wäre schlimmer als ein Warten auf den nächsten Lauf.
  group: publish
  cancel-in-progress: false

jobs:
  # ── Vorprüfung: gibt es überhaupt etwas zu veröffentlichen? ──────────────────
  # Bewusst ein eigener, billiger Job: er entscheidet, ob der Smoke-Test und der
  # Publish-Job überhaupt anlaufen. So kostet ein Push ohne veröffentlichungsrelevante
  # Commits seit dem letzten Tag nur wenige Sekunden.
  pruefen:
    name: Version prüfen
    runs-on: ubuntu-latest
    permissions:
      # contents: write, obwohl dieser Job nichts schreibt: semantic-release prüft auch im
      # --dry-run per `git push --dry-run`, ob es auf main pushen DÜRFTE, und bricht mit
      # EGITNOPERMISSION ab, bevor es die Commits überhaupt auswertet. Getaggt und
      # veröffentlicht wird weiterhin nur im `publish`-Job.
      contents: write
      packages: read
    outputs:
      # Aus `ermitteln`, nicht direkt aus der Engine: beim Nachholen einer abgebrochenen
      # Finalisierung kommt die Version aus dem letzten Tag, nicht aus der Engine.
      version: ${{ steps.ermitteln.outputs.version }}
      notes: ${{ steps.ermitteln.outputs.notes }}
      source_sha: ${{ steps.ermitteln.outputs.source_sha }}
      mode: ${{ steps.ermitteln.outputs.mode }}
      publish: ${{ steps.ermitteln.outputs.publish }}
      publish_css: ${{ steps.ermitteln.outputs.publish_css }}
      publish_lib: ${{ steps.ermitteln.outputs.publish_lib }}
      dry: ${{ steps.ermitteln.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle History + Tags: semantic-release muss den letzten vX.Y.Z-Tag finden und
          # alle Commits seit dort auswerten können.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@conciso'
      - name: Dependencies installieren
        run: npm ci
      # Berechnet Version + Notizen aus den Commits seit dem letzten Tag (siehe
      # release.config.mjs, scripts/release/semantic-release-plugin.mjs). Läuft IMMER als
      # Dry-Run: kein Plugin hier veröffentlicht, taggt oder erstellt ein GitHub-Release,
      # das übernimmt der `publish`-Job weiter unten. Schreibt die Version bei Bedarf nach
      # $GITHUB_OUTPUT (scripts/release/write-release-outputs.mjs) und die Notizen als Datei
      # (release-notes-generated.md), die per Artefakt an den `publish`-Job weitergereicht wird.
      - name: 'Engine: Version und Notizen aus den Commits ermitteln'
        id: engine
        run: npx semantic-release --dry-run --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nur beim manuellen Start der Branch, von dem aus gestartet wurde (siehe
          # release.config.mjs); ein Push-Lauf rechnet immer auf main.
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
      # Die eigentliche Entscheidung trifft scripts/release/decide.mjs (mit Tests); dieser
      # Schritt sammelt nur die Fakten dafür und bereitet danach Quellstand und Notes vor.
      # Grundsatz: ERST einen unfertigen früheren Release abschließen, DANN Neues — siehe
      # Kopfkommentar in decide.mjs.
      - name: Entscheiden, ob veröffentlicht wird
        id: ermitteln
        run: |
          REGISTRY=https://npm.pkg.github.com

          # Dry-Run nur beim manuellen Start, und dort als Default. Außerhalb von main IMMER
          # Dry-Run, auch mit dry_run=false: ein Probelauf vor dem Merge (manuell auf dem
          # Feature-Branch gestartet) darf nie veröffentlichen, taggen oder ein Release anlegen.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            DRY=true
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::notice::Lauf außerhalb von main (${{ github.ref_name }}) — erzwungener Dry-Run."
            DRY=true
          else
            DRY=false
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"

          # ── Fakten sammeln ──
          # Letzter Release-Tag (lokal vorhanden dank fetch-depth: 0) und ob er fertig ist.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          TAG_HAS_RELEASE=false; TAG_IS_ANNOTATED=false
          # Beide Abfragen unten scheitern „geschlossen“: Nur ein ausdrückliches „gibt es
          # nicht“ zählt als leer. Ein Ausfall, ein Rate-Limit oder ein Auth-Fehler bricht den
          # Lauf ab — als „leer“ gelesen, würde er einen unfertigen Release übersehen und
          # darüber hinweg eine neue Version veröffentlichen.
          if [ -n "$LATEST_TAG" ]; then
            if FEHLER=$(gh release view "$LATEST_TAG" 2>&1 >/dev/null); then
              TAG_HAS_RELEASE=true
            elif ! echo "$FEHLER" | grep -qi "release not found"; then
              echo "::error::GitHub-Release zu ${LATEST_TAG} nicht abfragbar: ${FEHLER}"
              exit 1
            fi
            [ "$(git cat-file -t "$LATEST_TAG")" = "tag" ] && TAG_IS_ANNOTATED=true
          fi
          # Alle veröffentlichten Versionen pro Paket; E404 = Paket existiert noch nicht.
          versionen() {
            local AUSGABE
            if AUSGABE=$(npm view "$1" versions --json --registry="$REGISTRY" 2>&1); then
              echo "$AUSGABE"
            elif echo "$AUSGABE" | grep -q "E404"; then
              echo '[]'
            else
              echo "::error::Registry-Abfrage für $1 fehlgeschlagen: ${AUSGABE}" >&2
              return 1
            fi
          }
          # Getrennt zuweisen: `export X=$(…)` würde den Exit-Code der Abfrage verschlucken.
          CSS_VERSIONS=$(versionen @conciso/design-system) || exit 1
          LIB_VERSIONS=$(versionen @conciso/design-system-angular) || exit 1
          export LATEST_TAG TAG_HAS_RELEASE TAG_IS_ANNOTATED DRY CSS_VERSIONS LIB_VERSIONS
          export ENGINE_VERSION="${{ steps.engine.outputs.version }}"
          echo "Letzter Tag: ${LATEST_TAG:-–} (Release=${TAG_HAS_RELEASE}, annotiert=${TAG_IS_ANNOTATED}), Engine: ${ENGINE_VERSION:-–}"

          # ── Entscheiden ──
          ENTSCHEIDUNG=$(node scripts/release/decide.mjs)
          echo "$ENTSCHEIDUNG"
          wert() { echo "$ENTSCHEIDUNG" | sed -n "s/^$1=//p"; }
          MODE=$(wert mode); VERSION=$(wert version)
          HINWEIS=$(wert hinweis)
          [ -n "$HINWEIS" ] && echo "::warning::${HINWEIS}"
          if [ "$MODE" = "nichts" ]; then
            echo "::notice::Kein veröffentlichungsrelevanter Commit seit dem letzten Tag — kein Release."
            { echo "publish=false"; echo "publish_css=false"; echo "publish_lib=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Quellstand: aus welchem Commit gebaut und getaggt wird ──
          case "$(wert source)" in
            head) SOURCE_SHA="${{ github.sha }}" ;;
            tag)  SOURCE_SHA=$(git rev-list -n 1 "$LATEST_TAG") ;;
            registry)
              # Das Nachzuziehende muss aus DEMSELBEN Quellstand kommen wie das schon
              # Veröffentlichte, sonst tragen die Lockstep-Pakete dieselbe Version, aber
              # verschiedene Inhalte (und der Tag landet auf einem späteren Commit). npm
              # vermerkt beim Publish den Commit als `gitHead`.
              # Nur ein echter Commit zählt: `npm view` kann für ein fehlendes Feld auch
              # „undefined“ o. Ä. liefern, und das darf den gitHead des zweiten Pakets nicht
              # verdecken. Geprüft wird Form (40 Hex-Zeichen) und Existenz im Checkout.
              SOURCE_SHA=""
              for PAKET in @conciso/design-system @conciso/design-system-angular; do
                KANDIDAT=$(npm view "${PAKET}@${VERSION}" gitHead --registry="$REGISTRY" 2>/dev/null || true)
                if [[ "$KANDIDAT" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${KANDIDAT}^{commit}" 2>/dev/null; then
                  SOURCE_SHA="$KANDIDAT"
                  break
                fi
              done
              if [ -z "$SOURCE_SHA" ]; then
                # Ohne bekannten Quellstand lieber laut scheitern als ein Paar mit
                # auseinanderlaufendem Inhalt veröffentlichen.
                echo "::error::Version ${VERSION} liegt ohne gitHead in der Registry — der Quellstand ist unbekannt. Manuell nachziehen."
                exit 1
              fi ;;
          esac
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # ── Notes: immer dieselben pfadgefilterten, nur je nach Fall anders beschafft ──
          # Die Engine hat ihre Notes oben schon geschrieben (Bereich letzter Tag..HEAD);
          # außer im Modus `neu` passen die nicht und werden ersetzt oder verworfen.
          case "$(wert notes_source)" in
            engine) ;;
            range)  node scripts/release/notes-for-range.mjs "$LATEST_TAG" "$SOURCE_SHA" "$VERSION" ;;
            # --cleanup=verbatim beim Taggen (siehe unten) hält die #-Überschriften darin.
            tag)    git tag -l --format='%(contents)' "$LATEST_TAG" > release-notes-generated.md ;;
            github) rm -f release-notes-generated.md ;;
            # Das GitHub-Release existiert schon, es braucht keine Notes.
            keine)  rm -f release-notes-generated.md ;;
          esac
          if [ -s release-notes-generated.md ]; then echo "notes=true" >> "$GITHUB_OUTPUT"; else echo "notes=false" >> "$GITHUB_OUTPUT"; fi

          # ── Ergebnis weiterreichen ──
          {
            echo "version=$VERSION"
            echo "mode=$MODE"
            echo "publish=true"
            echo "publish_css=$(wert publish_css)"
            echo "publish_lib=$(wert publish_lib)"
          } >> "$GITHUB_OUTPUT"
          case "$MODE" in
            nachziehen)   echo "::warning::Unfertiger Release ${VERSION} gefunden (ein vorheriger Lauf brach ab) — wird aus ${SOURCE_SHA} abgeschlossen. Neue Commits folgen im direkt danach angestoßenen Lauf." ;;
            finalisieren) echo "::warning::Tag v${VERSION} hat kein GitHub-Release (ein vorheriger Lauf brach ab) — wird nachgeholt. Neue Commits folgen im direkt danach angestoßenen Lauf." ;;
            neu)          echo "Neue Version: ${VERSION}" ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nach `ermitteln`, nicht direkt nach der Engine: beim Nachholen einer abgebrochenen
      # Finalisierung stammen die Notes aus dem annotierten Tag, nicht aus der Engine.
      - name: Notizen als Artefakt weiterreichen
        if: steps.ermitteln.outputs.publish == 'true' && steps.ermitteln.outputs.notes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes-generated.md
          retention-days: 1

  # ── Harte Vorbedingung: konsumierbares Artefakt? ────────────────────────────
  # Als reusable Workflow eingebunden (siehe Kommentar in consumer-smoke-test.yml),
  # weil `needs:` nur innerhalb derselben Datei wirkt. Bekommt die ermittelte Version, damit
  # der Smoke-Test das STAMPED Artefakt prüft, nicht den Platzhalter (Spec Regel 8).
  consumer-smoke-test:
    name: Consumer-Smoke-Test (Vorbedingung)
    needs: pruefen
    # Nur wenn wirklich ein Paket gebaut wird — beim reinen Finalisieren (Tag/Release
    # nachholen) nicht: dort kann der Quellstand ein Alt-Tag ohne Release-Skripte sein.
    if: needs.pruefen.outputs.publish_css == 'true' || needs.pruefen.outputs.publish_lib == 'true'
    uses: ./.github/workflows/consumer-smoke-test.yml
    with:
      version: ${{ needs.pruefen.outputs.version }}
      # Denselben Quellstand prüfen, der gleich gebaut wird (siehe `source_sha` in `ermitteln`).
      ref: ${{ needs.pruefen.outputs.source_sha }}

  publish:
    name: Beide Pakete bauen und veröffentlichen
    needs: [pruefen, consumer-smoke-test]
    # always(), weil ein übersprungener Smoke-Test (reines Finalisieren, s. o.) den Job sonst
    # mitüberspringen würde. Gescheitert oder abgebrochen darf er aber nicht sein — und
    # `pruefen` muss durchgelaufen sein: always() liefe sonst auch nach einem späten Fehler
    # dort (etwa beim Hochladen der Notes) los, obwohl publish=true schon gesetzt war.
    if: >-
      always() && needs.pruefen.result == 'success' && needs.pruefen.outputs.publish == 'true' &&
      (needs.consumer-smoke-test.result == 'success' || needs.consumer-smoke-test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      # contents: write für Tag und Release, die dieser Job selbst anlegt.
      contents: write
      packages: write
      # actions: write für den erneuten Anstoß nach einer Heilung (letzter Schritt).
      actions: write
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
      DRY: ${{ needs.pruefen.outputs.dry }}
      # Ob überhaupt ein Paket gebaut wird. Sonst (reines Finalisieren) nur Tag/Release.
      BAUEN: ${{ needs.pruefen.outputs.publish_css == 'true' || needs.pruefen.outputs.publish_lib == 'true' }}
    steps:
      # Nicht zwingend der ausgelöste Commit: beim Nachziehen eines halben Releases der
      # Quellstand des schon veröffentlichten Pakets (siehe `ermitteln`), damit beide
      # Lockstep-Pakete denselben Inhalt tragen und der Tag auf diesem Stand landet.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pruefen.outputs.source_sha }}
      - uses: actions/setup-node@v4
        if: env.BAUEN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@conciso'
      # npm-Workspace (storybook-angular + angular-lib) → vom Repo-Root installieren.
      - name: Dependencies installieren
        if: env.BAUEN == 'true'
        run: npm ci
      # Schreibt die ermittelte Version in beide package.json + die Peer-Pin der Lib
      # (Spec Regel 7). NIE committet — nur der Checkout dieses Runs trägt sie.
      - name: Version in die Artefakte stempeln
        if: env.BAUEN == 'true'
        run: node scripts/release/stamp-version.mjs "$VERSION"
      - name: CSS-Schicht bauen (@conciso/design-system)
        if: env.BAUEN == 'true'
        run: npm run build
      - name: Angular-Lib bauen (@conciso/design-system-angular)
        if: env.BAUEN == 'true'
        run: npm run build --workspace=angular-lib
      - name: Dry-Run-Flag bestimmen
        id: mode
        run: |
          if [ "$DRY" = "true" ]; then echo "flag=--dry-run" >> "$GITHUB_OUTPUT";
          else echo "flag=" >> "$GITHUB_OUTPUT"; fi
      # Einzeln konditioniert: beim Nachziehen eines unvollständigen Releases wird
      # nur das fehlende Paket veröffentlicht — ein zweites `npm publish` derselben
      # Version würde sonst mit 409 abbrechen.
      - name: CSS-Schicht veröffentlichen
        if: needs.pruefen.outputs.publish_css == 'true'
        run: npm publish ${{ steps.mode.outputs.flag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Angular-Lib veröffentlichen
        if: needs.pruefen.outputs.publish_lib == 'true'
        working-directory: angular-lib/dist/design-system-angular
        run: npm publish ${{ steps.mode.outputs.flag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release-Notizen herunterladen
        if: env.DRY == 'false' && needs.pruefen.outputs.notes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      # Der Tag macht die Konvention aus dem CHANGELOG wahr („Releases werden als
      # Git-Tags vX.Y.Z markiert“) — ohne ihn zeigt nichts im Repo auf die
      # veröffentlichte Version. Läuft erst NACH den Publishes: ein Tag auf einem
      # Stand, dessen Veröffentlichung scheiterte, wäre irreführend.
      - name: Tag setzen und Release veröffentlichen
        if: env.DRY == 'false'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VERSION} existiert bereits — wird nicht neu gesetzt."
          else
            # Annotierter Tag mit den Release-Notes als Nachricht: Scheitert gleich danach
            # `gh release create`, holt der nächste Lauf das Release mit genau diesen
            # (pfadgefilterten) Notes nach, statt sie neu erzeugen zu müssen (siehe
            # `ermitteln`). Ein annotierter Tag braucht eine Identität. `--cleanup=verbatim`
            # ist Pflicht: der Standard „strip“ löscht jede Zeile, die mit # beginnt — also
            # sämtliche Markdown-Überschriften der Notes.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -s release-notes-generated.md ]; then
              git tag -a "v${VERSION}" --cleanup=verbatim -F release-notes-generated.md
            else
              git tag -a "v${VERSION}" -m "v${VERSION}"
            fi
            git push origin "v${VERSION}"
          fi
          # Beim Nachziehen eines unvollständigen Releases kann das Release schon
          # existieren — dann nicht scheitern.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} existiert bereits — wird nicht neu erstellt."
          elif [ -f release-notes-generated.md ]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-notes-generated.md
          else
            # Letzter Rückfall, nur beim Nachholen für einen Tag ohne gespeicherte Notes
            # (leichtgewichtiger Tag aus der Zeit vor ADR-0010): GitHub erzeugt die Notes
            # aus den Commits seit dem vorherigen Tag — ungefiltert, aber besser als keine.
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nach `nachziehen`/`finalisieren` hat dieser Lauf nur Altes abgeschlossen und die
      # inzwischen gelandeten Commits bewusst liegen lassen (siehe decide.mjs). Ein neuer
      # Lauf ab dem jetzt fertigen Tag holt sie ab, statt bis zum nächsten Push zu warten.
      # workflow_dispatch ist das einzige Ereignis, das der GITHUB_TOKEN auslösen darf. Keine
      # Schleife: jeder Anstoß folgt auf einen abgeschlossenen Release, der danach nicht mehr
      # als unfertig gilt; scheitert die Heilung, endet der Lauf vor diesem Schritt.
      - name: Nach der Heilung erneut anstoßen
        if: env.DRY == 'false' && needs.pruefen.outputs.mode != 'neu'
        run: gh workflow run publish.yml --ref main -f dry_run=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
