name: Storybook / Vorschau

# Baut für einen PR das Storybook, das als PR-Vorschau unter
# https://conciso.github.io/conciso-design-system/pr-preview/pr-<N>/ erscheint (ADR-0009).
# Veröffentlicht wird hier NICHTS: Dieser Workflow läuft unprivilegiert unter `pull_request`
# und lädt nur den Build als Artefakt hoch. Den Deploy übernimmt storybook-pages.yml per
# `workflow_run` im Kontext von main — dort greift die main-only-Regel des
# github-pages-Environments, und ein PR-Lauf bekommt nie Schreibrecht auf Pages.
#
# Eigener Workflow statt eines Jobs in storybook-angular.yml: `workflow_run` wartet auf den
# GANZEN auslösenden Workflow. Die Vorschau soll aber nach Lint + Typecheck + Build erscheinen,
# ohne auf Vitest und das Kontrast-Gate zu warten. Storybook wird bei einem PR dadurch zweimal
# gebaut — bewusst in Kauf genommen.
#
# Pfadfilter wie storybook-angular.yml, plus die Dateien der Vorschau-Pipeline selbst.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/storybook/**'
      - 'packages/**'
      - 'docs/legacy-site/**'
      - 'tools/checks/check-contrast.mjs'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
      - '.github/workflows/storybook-preview.yml'
      - '.github/workflows/storybook-pages.yml'
      - 'tools/ci/pages-site*.mjs'
      - 'tools/ci/story-links*.mjs'
      - 'tools/ci/pr-comment*.mjs'

# Ein neuer Push verwirft den laufenden Build desselben PRs; der abgebrochene Lauf endet
# als `cancelled` und wird von storybook-pages.yml nicht veröffentlicht.
concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Vorschau bauen
    # Keine Vorschau für Fork-PRs (ADR-0009): fremdes HTML/JS unter conciso.github.io braucht
    # eine eigene Entscheidung. storybook-pages.yml prüft das zusätzlich selbst.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storybook
    steps:
      # Volle Historie: story-links.mjs braucht den Merge-Base mit dem Ziel-Branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspaces → vom Repo-Root aus installieren (wie storybook-angular.yml).
      - name: Dependencies installieren
        working-directory: .
        run: npm ci
      - name: Lint
        working-directory: .
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests der CI-Werkzeuge
        working-directory: .
        run: npm run test:ci
      - name: Storybook bauen
        run: npm run build-storybook
      # Neue und geänderte Stories für den PR-Kommentar. Nicht gate-relevant: Scheitert die
      # Ermittlung, steht im Kommentar nur der Vorschau-Link, und die Vorschau erscheint trotzdem.
      # Der Checkout ist der Merge-Stand (refs/pull/N/merge), der Merge-Base mit dem Ziel-Branch
      # also dessen Spitze — der Diff zeigt genau die Änderungen des PRs.
      - name: Story-Links ermitteln
        id: story-links
        continue-on-error: true
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          node tools/ci/story-links.mjs --base "origin/$BASE_REF" \
            --preview-root "https://$owner.github.io/$REPO_NAME/pr-preview/pr-$PR/" \
            --out "$RUNNER_TEMP/story-links.json"
      # Nur Daten: storybook-pages.yml kopiert den Inhalt in den Speicher, führt nichts davon
      # aus. Die PR-Nummer nimmt der Publish-Workflow aus dem workflow_run-Payload, nicht aus
      # dem Artefakt.
      - name: Vorschau-Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: storybook-preview
          path: apps/storybook/dist
          retention-days: 7
      # Eigenes Artefakt, nicht im Build: Der Build-Inhalt wird veröffentlicht, die Links nicht.
      # Fremddaten für den Publish-Workflow — er prüft sie, bevor er daraus einen Kommentar macht.
      - name: Story-Links hochladen
        if: steps.story-links.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-story-links
          path: ${{ runner.temp }}/story-links.json
          retention-days: 7
