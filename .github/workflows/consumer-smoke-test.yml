name: Consumer-Smoke-Test

# Baut Angular-Lib + CSS-Schicht, tarballt beide per `npm pack` und installiert
# sie in die committete Consumer-Fixture (tools/consumer-fixture) — dann ein
# produktiver AOT-`ng build` dort. Fängt Fehler ab, die kein anderer Test sieht:
# unvollständige APF-Metadaten, fehlende Re-Exports in public-api.ts, nicht
# auflösbare peer-Deps, AOT-Template-Typfehler, fehlende Icon-Registrierung.
# Siehe CONTEXT.md#consumer-smoke-test, docs/adr/0003 + 0004.
#
# `workflow_call` macht den Job als reusable Workflow aufrufbar: publish.yml bindet ihn per
# `uses: ./.github/workflows/consumer-smoke-test.yml` als eigenen Job ein und verdrahtet den
# Publish-Job per `needs:` darauf — `needs:` funktioniert nur innerhalb derselben
# Workflow-Datei, reusable Workflows sind der Weg, das trotzdem über Workflow-Grenzen hinweg
# abzubilden. Der optionale `version`-Input (docs/adr/0010-release-ausloesung-und-versionsquelle.md
# Regel 8) lässt publish.yml das GESTEMPELTE Artefakt prüfen statt des Platzhalters 0.0.0:
# leer bei PR/Push (dort gibt es noch keine Version), gesetzt beim Aufruf aus publish.yml.
on:
  push:
    branches: [main]
    paths:
      - 'packages/css/**'
      - 'packages/angular/**'
      - 'tools/consumer-fixture/**'
      - 'tools/checks/consumer-smoke-test.sh'
      - 'tools/release/stamp-version.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/consumer-smoke-test.yml'
  pull_request:
  # Kein paths-Filter: der AOT-Build ist Pflicht-Check im Ruleset für main —
  # ein nie gestarteter Workflow würde PRs ohne Lib-Änderung dauerhaft blockieren.
  workflow_call:
    inputs:
      version:
        description: 'Version zum Stempeln vor dem Build (leer = Platzhalter 0.0.0 bleibt stehen)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Commit, aus dem gebaut wird (leer = der auslösende Commit)'
        required: false
        type: string
        default: ''

concurrency:
  # github.workflow ist bei einem Aufruf aus publish.yml der Name des AUFRUFERS. So bekommt
  # der Smoke-Test als Publish-Vorbedingung eine eigene Gruppe und kann nicht von einem
  # eigenständigen Lauf für einen späteren Push abgebrochen werden — sonst fiele der
  # wartende Publish-Job still aus.
  group: consumer-smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Exit: Berührt ein PR nichts, was dieser Workflow prüft, wird der schwere Job
  # (npm ci und AOT-Build) übersprungen — GitHub wertet das im Pflicht-Check des Rulesets als bestanden.
  # Andere Events (push, dispatch, Aufruf aus publish.yml) laufen immer: dort gibt es diesen
  # Job gar nicht. Die Musterliste hier mit den `paths:` des push-Triggers oben gleich halten.
  changes:
    name: Relevante Änderungen erkennen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Bei pull_request ist HEAD der Merge-Commit; HEAD^1 (Base) reicht als Diff-Basis.
          fetch-depth: 2
      - name: Geänderte Pfade gegen die Muster dieses Workflows prüfen
        id: diff
        run: >
          node tools/ci/changed-paths.mjs
          'packages/css/**'
          'packages/angular/**'
          'tools/consumer-fixture/**'
          'tools/checks/consumer-smoke-test.sh'
          'tools/release/stamp-version.mjs'
          'package.json'
          'package-lock.json'
          '.github/workflows/consumer-smoke-test.yml'

  consumer-smoke-test:
    name: AOT-Build der Consumer-Fixture (Tarball-Konsum)
    needs: changes
    # !cancelled() statt Standard-Bedingung: Wo `changes` übersprungen wird (push, dispatch,
    # workflow_call) oder scheitert, ist `relevant` leer → der Job läuft (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Aufruf aus publish.yml ggf. ein älterer Quellstand (Nachziehen eines halben
          # Releases); bei push/pull_request ist inputs.ref leer → auslösender Commit.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspaces (packages/*, apps/*) → vom Repo-Root installieren.
      - name: Dependencies installieren
        run: npm ci
      - name: Consumer-Smoke-Test
        # Explizit über bash, nicht als ausführbare Datei: so hängt der Lauf nicht
        # daran, dass das Execute-Bit jeden Checkout übersteht.
        run: bash tools/checks/consumer-smoke-test.sh "${{ inputs.version }}"
