name: CSS-Kern

on:
  push:
    branches: [main]
    paths:
      - 'packages/css/**'
      - 'tools/checks/check-dark-states.mjs'
      - 'package.json'
      - '.github/workflows/css-core.yml'
  pull_request:
    paths:
      - 'packages/css/**'
      - 'tools/checks/check-dark-states.mjs'
      - 'package.json'
      - '.github/workflows/css-core.yml'

concurrency:
  group: css-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (tokens + icons + css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Gebaut wird nur das CSS-Paket (nicht der Root-Build, der auch Angular-Lib, Storybook
      # und MCP-Snapshot baut). Die Build-Skripte sind reines Node (tokens → icons →
      # gebündeltes CSS), daher kein npm install nötig.
      - name: Build
        run: npm run build -w packages/css
      - name: Build-Output prüfen
        run: |
          test -f packages/css/dist/conciso-ds.css
          test -f packages/css/dist/tokens/tokens.json
          test -f packages/css/dist/tokens/tokens.scss
          test -f packages/css/dist/tokens/tokens.js
          test -f packages/css/dist/icons/icons.json
          test -f packages/css/dist/icons/icons.js
          test -f packages/css/dist/icons/icons.d.ts
          test -f packages/css/dist/icons/README.md
      # Zustands-Regeln (:hover, :focus, :active) in components.css können im Dark Mode
      # dunkel-auf-dunkel laufen, weil dark-mode.css VOR components.css geladen wird und die
      # Light-Regel dadurch bei gleicher Spezifität gewinnt. Der Check rechnet echten Kontrast
      # und findet die Klasse, statt auf Stichproben zu warten. Siehe CONTRIBUTING § 5.
      - name: Dark-Mode-Zustände prüfen
        run: npm run check:dark-states
