name: CSS-Kern

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'tokens/**'
      - 'icons/**'
      - 'fonts/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/css-core.yml'
  pull_request:
    paths:
      - 'css/**'
      - 'tokens/**'
      - 'icons/**'
      - 'fonts/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/css-core.yml'

concurrency:
  group: css-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (tokens + icons + css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Root hat keine Dependencies/Lockfile — die Build-Skripte sind reines Node
      # (tokens → icons → gebündeltes CSS), daher kein npm install nötig.
      - name: Build
        run: npm run build
      - name: Build-Output prüfen
        run: test -f dist/conciso-ds.css
      # Zustands-Regeln (:hover, :focus, :active) in components.css können im Dark Mode
      # dunkel-auf-dunkel laufen, weil dark-mode.css VOR components.css geladen wird und die
      # Light-Regel dadurch bei gleicher Spezifität gewinnt. Der Check rechnet echten Kontrast
      # und findet die Klasse, statt auf Stichproben zu warten. Siehe CONTRIBUTING § 5.
      - name: Dark-Mode-Zustände prüfen
        run: npm run check:dark-states
      # dist/, tokens/ und icons/ sind abgeleitet, werden aber bewusst eingecheckt
      # (das Paket soll ohne Build-Schritt konsumierbar sein). Ohne diesen Vergleich
      # fällt es nicht auf, wenn jemand css/ ändert und den Build vergisst: die
      # Pipeline bliebe grün und das Paket lieferte veraltetes CSS aus.
      # git status statt git diff, weil diff neu entstandene (untracked) Dateien
      # nicht sieht.
      - name: Abgeleitete Dateien sind aktuell
        run: |
          if [ -n "$(git status --porcelain -- dist tokens icons)" ]; then
            echo "::error::dist/, tokens/ oder icons/ weichen von den Quellen ab. npm run build ausführen und das Ergebnis committen."
            git status --short -- dist tokens icons
            git diff -- dist tokens icons
            exit 1
          fi
          echo "Abgeleitete Dateien stimmen mit den Quellen überein."
