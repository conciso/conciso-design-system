# Anführungszeichen-Gate: findet Paare, die typografisch öffnen (U+201E) und mit dem
# geraden ASCII-Zeichen schließen statt mit U+201C, siehe CONTRIBUTING § 6 und
# scripts/check-quotes.mjs. Bewusst OHNE Pfadfilter: Copy und Kommentare liegen überall
# (docs/, css/, storybook-angular/, Markdown auf Root-Ebene), und der Check ist
# dependency-frei und in Sekunden durch.
# Das Fehlermuster steht hier als U+-Notation, nicht als Glyphenpaar — der Check prüft
# diese Datei mit.
#
# Zweiter Check im selben Job: scripts/check-ticket-refs.mjs (CONTRIBUTING § 17) — findet
# neue Verweise auf lokale Ticket-Dateien außerhalb ihres eigenen, gitignoreten
# Verzeichnisses. Davor laufen dessen eigene Unit-Tests (scripts/check-ticket-refs.test.mjs,
# Stil wie scripts/release/*.test.mjs, node:test) gegen das Muster und die Allowlist selbst.
# Alle drei Schritte sind dependency-freie Textsuchen/-tests über denselben Dateibestand
# (node:test ist Teil der Node-Runtime, kein npm ci nötig), ein zweiter Job würde nur denselben
# Checkout ein zweites Mal bezahlen.
name: Anführungszeichen

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quotes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kaputte Anführungszeichen-Paare und Ticket-Referenzen finden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anführungszeichen prüfen
        run: npm run check:quotes
      - name: Ticket-Referenzen-Muster testen
        run: npm run test:ticket-refs
      - name: Ticket-Referenzen prüfen
        run: npm run check:ticket-refs
