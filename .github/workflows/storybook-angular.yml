name: Storybook / Angular

# Läuft bei Änderungen an storybook-angular, an der Lib unter angular-lib (dort
# liegen seit der Extraktion die Komponenten selbst — ohne diesen Eintrag bliebe
# ein reiner Lib-PR ungetestet) UND an der CSS-Schicht, die die Stories rendern
# (die Preview linkt css/* und staticDirs css/dist/icons/fonts) — so fangen die
# a11y-/Render-Tests auch CSS-Regressionen.
on:
  push:
    branches: [main]
    paths:
      - 'storybook-angular/**'
      - 'angular-lib/**'
      - 'css/**'
      - 'dist/**'
      - 'icons/**'
      - 'fonts/**'
      - 'tokens/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
  pull_request:
    paths:
      - 'storybook-angular/**'
      - 'angular-lib/**'
      - 'css/**'
      - 'dist/**'
      - 'icons/**'
      - 'fonts/**'
      - 'tokens/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
  # Manueller Nachtrigger für einen Pages-Deploy ohne neuen Push auf main
  # (z. B. nach dem Aktivieren von Pages, oder um einen fehlgeschlagenen
  # Deploy zu wiederholen).
  workflow_dispatch: {}

# Ein gemeinsamer Concurrency-Kanal für den ganzen Workflow würde einen bereits
# laufenden Pages-Deploy abbrechen können, sobald derselbe Ref (main) erneut
# gepusht wird — GitHub Pages verträgt aber keinen abgebrochenen Deploy gut
# (die Umgebung bleibt im Zustand „in progress“ hängen). cancel-in-progress
# bleibt daher für Lint/Build/Tests aktiv (schnelles Feedback bei mehreren
# Pushes/PRs ist hier erwünscht), gilt aber nur für den `verify`-Kanal; der
# Deploy nach GitHub Pages läuft in einer eigenen Gruppe ohne Abbruch (siehe
# `deploy`-Job unten).
concurrency:
  group: storybook-angular-${{ github.ref }}
  cancel-in-progress: true

# Minimalberechtigung auf Workflow-Ebene; der Deploy-Job hebt sie gezielt für
# sich selbst an (pages: write, id-token: write).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Build, Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: storybook-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspace (storybook-angular + angular-lib teilen sich @angular/* etc. in
      # einem Root-node_modules, siehe docs/adr/0002) → vom Repo-Root aus installieren.
      - name: Dependencies installieren
        working-directory: .
        run: npm ci
      - name: Lint
        run: npm run lint
      # build-storybook nutzt den Angular-Compiler → deckt zugleich den Typecheck ab.
      - name: Storybook bauen
        run: npm run build-storybook
      # Das Manifest ist die Schnittstelle für Agenten/MCP-Clients (addon-mcp,
      # experimentalDocgenServer); ohne dieses Gate fiele ein stilles Wegfallen
      # (z. B. durch ein zukünftiges Storybook-Update oder eine geänderte
      # Addon-Konfiguration) nicht auf.
      - name: Komponenten-Manifest vorhanden
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'storybook-static/manifests/components.json';
            if (!fs.existsSync(path)) {
              console.error('Manifest fehlt: ' + path);
              process.exit(1);
            }
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const docgen = manifest.meta && manifest.meta.docgen;
            if (docgen !== 'angular-component-meta') {
              console.error('meta.docgen erwartet \"angular-component-meta\", war: ' + docgen);
              process.exit(1);
            }
            const count = Object.keys(manifest.components || {}).length;
            if (count < 1) {
              console.error('Manifest enthaelt keine Komponenten-Eintraege');
              process.exit(1);
            }
            console.log('Manifest ok: docgen=' + docgen + ', Eintraege=' + count);
          "
      - name: Playwright-Browser installieren
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      # Vitest (@storybook/addon-vitest, Browser-Mode via Playwright/Chromium)
      # führt jede Story als Test aus (Smoke + axe-a11y + play), direkt aus der
      # Quelle — kein statischer Build/Server nötig. Ersetzt den bisherigen
      # Storybook-Test-Runner (Jest), der dieselben Stories redundant ein
      # zweites Mal fuhr (siehe docs/adr/0005). Ohne VISUAL=1 keine
      # Bildvergleiche; die laufen gepinnt in .github/workflows/visual.yml.
      - name: Storybook-Tests (Vitest)
        run: npm run test:vitest
      # Kontrast-Gate der Doku-Seite. Hängt hier und nicht in css-core.yml, weil es einen
      # Browser braucht: das Wurzelprojekt bleibt absichtlich ohne Dependencies, Playwright
      # lebt in diesem Workspace und ist eine Zeile weiter oben schon installiert.
      - name: Kontrast-Gate (Doku, beide Modi)
        working-directory: .
        # PLAYWRIGHT_BROWSERS_PATH=0 wie beim Install oben: der Browser liegt dann im
        # playwright-core-Paket selbst, das Skript findet ihn von der Wurzel aus.
        run: PLAYWRIGHT_BROWSERS_PATH=0 npm run check:contrast
      # Nur hochladen, wenn danach auch tatsächlich deployt wird (Push auf main
      # oder manueller Trigger) — dieselbe Bedingung wie im deploy-Job. Sonst
      # läge bei jedem PR ein ungenutztes Pages-Artefakt herum.
      - name: Storybook-Build als Pages-Artefakt hochladen
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-angular/storybook-static

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Eigener, job-scoped Concurrency-Kanal (überschreibt die Workflow-weite
    # Gruppe oben nur für diesen Job): cancel-in-progress bleibt aus, ein
    # bereits laufender Pages-Deploy soll zu Ende laufen statt in einem
    # halbfertigen Zustand abgebrochen zu werden. Ein neuer Lauf wartet
    # stattdessen in der Warteschlange (GitHub-Pages-Deployments sind ohnehin
    # seriell: pro Environment läuft immer nur einer).
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
