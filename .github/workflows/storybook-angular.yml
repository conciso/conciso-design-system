name: Storybook / Angular

# Läuft bei Änderungen an der Storybook-App (apps/storybook), an der Lib unter packages/angular
# (dort liegen die Komponenten selbst — ohne diesen Eintrag bliebe ein reiner Lib-PR
# ungetestet) UND an der CSS-Schicht, die die Stories rendern (die Preview linkt
# packages/css/css/* und staticDirs packages/css/dist/icons/fonts/assets/brand) — so
# fangen die a11y-/Render-Tests auch CSS-Regressionen, und eine geänderte Wortmarke
# landet auch ohne weiteren Push auf GitHub Pages.
#
# Veröffentlicht wird hier nichts mehr: storybook-pages.yml übernimmt per `workflow_run` den
# `storybook-static`-Build eines erfolgreichen `verify`-Laufs auf main und deployt ihn
# zusammen mit den PR-Vorschauen (ADR-0009).
on:
  push:
    branches: [main]
    paths:
      - 'apps/storybook/**'
      - 'packages/**'
      - 'docs/legacy-site/**'
      - 'tools/checks/check-contrast.mjs'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
  pull_request:
  # Kein paths-Filter: „Lint, Build, Tests“ ist Pflicht-Check im Ruleset für main —
  # ein nie gestarteter Workflow würde PRs ohne Storybook-Änderung dauerhaft blockieren.
  # Manueller Nachtrigger: Ein Lauf auf main stößt über storybook-pages.yml
  # einen Pages-Deploy mit frischem main-Build an, ohne neuen Push.
  workflow_dispatch: {}

# Abbrechen nur außerhalb von main: Auf PR-Branches ist schnelles Feedback
# erwünscht, ein neuer Push verwirft den alten Lauf. Auf main dagegen läuft der
# ältere Lauf zu Ende, damit sein geprüfter Build über storybook-pages.yml live
# geht; ein neuer wartet (GitHub behält dabei nur den jüngsten wartenden Lauf,
# Zwischenstände fallen weg).
concurrency:
  group: storybook-angular-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast Exit: Berührt ein PR nichts, was dieser Workflow prüft, wird der schwere Job
  # (Lint, Storybook-Build, Vitest und Kontrast-Gate) übersprungen — GitHub wertet das im Pflicht-Check des Rulesets als bestanden.
  # Andere Events (push, dispatch, Aufruf aus publish.yml) laufen immer: dort gibt es diesen
  # Job gar nicht. Die Musterliste hier mit den `paths:` des push-Triggers oben gleich halten.
  changes:
    name: Relevante Änderungen erkennen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Bei pull_request ist HEAD der Merge-Commit; HEAD^1 (Base) reicht als Diff-Basis.
          fetch-depth: 2
      - name: Geänderte Pfade gegen die Muster dieses Workflows prüfen
        id: diff
        run: >
          node tools/ci/changed-paths.mjs
          'apps/storybook/**'
          'packages/**'
          'docs/legacy-site/**'
          'tools/checks/check-contrast.mjs'
          'package.json'
          'package-lock.json'
          '.github/workflows/storybook-angular.yml'

  verify:
    name: Lint, Build, Tests
    needs: changes
    # !cancelled() statt Standard-Bedingung: Wo `changes` übersprungen wird (push, dispatch,
    # workflow_call) oder scheitert, ist `relevant` leer → der Job läuft (fail-safe).
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspaces (apps/storybook + packages/angular teilen sich @angular/* etc. in
      # einem Root-node_modules, siehe docs/adr/0002) → vom Repo-Root aus installieren.
      - name: Dependencies installieren
        working-directory: .
        run: npm ci
      # Root statt Default-working-directory: das Root-Script `lint` lintet BEIDE
      # Workspaces (packages/angular, apps/storybook, packages/mcp) — mit dem Default liefe hier
      # nur der `lint`-Script der Storybook-App und ein Lint-Fehler in
      # packages/angular bliebe unbemerkt.
      - name: Lint
        working-directory: .
        run: npm run lint
      # build-storybook baut über Vite und prüft keine Typen. Den Typecheck übernimmt das
      # App-Target `build` (browserTarget der Storybook-Targets, tsconfig.json inkl. Stories).
      - name: Typecheck
        run: npm run typecheck
      - name: Storybook bauen
        run: npm run build-storybook
      # Das Manifest ist die Schnittstelle für Agenten/MCP-Clients (addon-mcp,
      # experimentalDocgenServer); ohne dieses Gate fiele ein stilles Wegfallen
      # (z. B. durch ein zukünftiges Storybook-Update oder eine geänderte
      # Addon-Konfiguration) nicht auf.
      - name: Komponenten-Manifest vorhanden
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'dist/manifests/components.json';
            if (!fs.existsSync(path)) {
              console.error('Manifest fehlt: ' + path);
              process.exit(1);
            }
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const docgen = manifest.meta && manifest.meta.docgen;
            if (docgen !== 'angular-component-meta') {
              console.error('meta.docgen erwartet \"angular-component-meta\", war: ' + docgen);
              process.exit(1);
            }
            const count = Object.keys(manifest.components || {}).length;
            if (count < 1) {
              console.error('Manifest enthaelt keine Komponenten-Eintraege');
              process.exit(1);
            }
            console.log('Manifest ok: docgen=' + docgen + ', Eintraege=' + count);
          "
      - name: Playwright-Browser installieren
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      # Vitest (@storybook/addon-vitest, Browser-Mode via Playwright/Chromium)
      # führt jede Story als Test aus (Smoke + axe-a11y + play), direkt aus der
      # Quelle — kein statischer Build/Server nötig. Ersetzt den bisherigen
      # Storybook-Test-Runner (Jest), der dieselben Stories redundant ein
      # zweites Mal fuhr (siehe docs/adr/0005). Ohne VISUAL=1 keine
      # Bildvergleiche; die laufen gepinnt in .github/workflows/visual.yml.
      - name: Storybook-Tests (Vitest)
        run: npm run test:vitest
      # Das Kontrast-Gate hängt hier und nicht in css-core.yml, weil es einen
      # Browser braucht: das Wurzelprojekt bleibt absichtlich ohne Dependencies, Playwright
      # lebt in diesem Workspace und ist eine Zeile weiter oben schon installiert.
      - name: Kontrast-Gate (Doku, beide Modi)
        working-directory: .
        # PLAYWRIGHT_BROWSERS_PATH=0 wie beim Install oben: der Browser liegt dann im
        # playwright-core-Paket selbst, das Skript findet ihn von der Wurzel aus.
        run: PLAYWRIGHT_BROWSERS_PATH=0 npm run check:contrast
      # Unbedingt (nicht nur auf main) hochladen: der mcp-smoke-test-Job unten braucht denselben
      # Storybook-Build bei jedem PR und Push, um manifests/ + services/ in den MCP-Snapshot zu
      # kopieren (ADR-0012). Auf main holt storybook-pages.yml genau dieses Artefakt per
      # `workflow_run` direkt nach dem Lauf ab und veröffentlicht es. Kurze Aufbewahrung, weil es
      # ein reines Zwischenartefakt ist.
      - name: Storybook-Build für MCP-Snapshot hochladen
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/dist
          retention-days: 1

  # MCP-Server-Tarball-Smoke-Test (ADR-0012): baut aus demselben Storybook-Build wie oben (kein
  # zweiter build-storybook-Lauf) den Snapshot des @conciso/design-system-mcp-Pakets, tarballt es
  # per `npm pack` und installiert genau dieses Tarball in ein frisches Verzeichnis — wie ein
  # Consumer es täte —, um dort über stdio rohes JSON-RPC gegen `cds-mcp` zu sprechen
  # (packages/mcp/scripts/smoke-test.mjs). Läuft bei jedem PR und Push (kein `if:`, folgt also
  # `verify`s eigenen Trigger-Bedingungen), unabhängig vom Pages-Deploy — storybook-pages.yml
  # prüft bewusst nur das Ergebnis von `verify`, nicht zusätzlich hiervon.
  mcp-smoke-test:
    name: MCP-Server — Tarball-Smoke-Test über stdio
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspace wie im verify-Job → vom Repo-Root installieren.
      - name: Dependencies installieren
        run: npm ci
      - name: Storybook-Build aus dem verify-Job herunterladen
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/dist
      - name: MCP-Snapshot bauen
        run: npm run build:snapshot -w packages/mcp
      # Unit-Tests des Pakets (test/*.test.mjs, braucht den Snapshot direkt eben gebaut) und der
      # Eval-Checker-Logik (packages/mcp/eval/checker.test.mjs, bewusst getrennt gehalten von `npm test`,
      # siehe Kommentar in eval/checker.test.mjs — braucht den Snapshot NICHT, arbeitet mit
      # handgepflegten Fixtures).
      - name: Unit-Tests (packages/mcp)
        run: npm test -w packages/mcp
      - name: Eval-Checker-Tests (packages/mcp)
        run: npm run test:eval-checker -w packages/mcp
      # Tarball packen und Smoke-Test über stdio fahren: EIN Skript-Aufruf statt des Shell-Blocks
      # „npm pack … find die eine .tgz … smoke-test.mjs“, der hier und in publish.yml früher
      # doppelt gepflegt wurde (siehe test-support/tarball.mjs). Ohne Pfad-Argument packt
      # smoke-test.mjs sich selbst; anders als publish.yml braucht dieser Job den Tarball-Pfad
      # danach nicht weiter.
      - name: Tarball packen und Smoke-Test über stdio fahren
        run: node packages/mcp/scripts/smoke-test.mjs
