name: Storybook / Angular

# Läuft bei Änderungen an storybook-angular, an der Lib unter angular-lib (dort
# liegen seit der Extraktion die Komponenten selbst — ohne diesen Eintrag bliebe
# ein reiner Lib-PR ungetestet) UND an der CSS-Schicht, die die Stories rendern
# (die Preview linkt css/* und staticDirs css/dist/icons/fonts/assets/brand) — so
# fangen die a11y-/Render-Tests auch CSS-Regressionen, und eine geänderte Wortmarke
# landet auch ohne weiteren Push auf GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'storybook-angular/**'
      - 'angular-lib/**'
      - 'mcp-server/**'
      - 'css/**'
      - 'dist/**'
      - 'icons/**'
      - 'fonts/**'
      - 'assets/**'
      - 'tokens/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
  pull_request:
    paths:
      - 'storybook-angular/**'
      - 'angular-lib/**'
      - 'mcp-server/**'
      - 'css/**'
      - 'dist/**'
      - 'icons/**'
      - 'fonts/**'
      - 'assets/**'
      - 'tokens/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/storybook-angular.yml'
  # Manueller Nachtrigger für einen Pages-Deploy ohne neuen Push auf main
  # (z. B. nach dem Aktivieren von Pages, oder um einen fehlgeschlagenen
  # Deploy zu wiederholen).
  workflow_dispatch: {}

# Abbrechen nur außerhalb von main: Auf PR-Branches ist schnelles Feedback
# erwünscht, ein neuer Push verwirft den alten Lauf. Auf main dagegen hängt am
# Ende der Pages-Deploy, und ein Workflow-weiter Abbruch träfe auch einen schon
# laufenden `deploy`-Job — die Job-Gruppe `pages` unten kann das nicht
# verhindern, weil der Abbruch auf Workflow-Ebene greift. Auf main läuft der
# ältere Lauf deshalb zu Ende; ein neuer wartet (GitHub behält dabei nur den
# jüngsten wartenden Lauf, Zwischenstände fallen weg).
concurrency:
  group: storybook-angular-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimalberechtigung auf Workflow-Ebene; der Deploy-Job hebt sie gezielt für
# sich selbst an (pages: write, id-token: write).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Build, Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: storybook-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspace (storybook-angular + angular-lib teilen sich @angular/* etc. in
      # einem Root-node_modules, siehe docs/adr/0002) → vom Repo-Root aus installieren.
      - name: Dependencies installieren
        working-directory: .
        run: npm ci
      # Root statt Default-working-directory: das Root-Script `lint` lintet BEIDE
      # Workspaces (angular-lib + storybook-angular) — mit dem Default liefe hier
      # nur der storybook-angular-eigene `lint`-Script und ein Lint-Fehler in
      # angular-lib bliebe unbemerkt.
      - name: Lint
        working-directory: .
        run: npm run lint
      # build-storybook baut über Vite und prüft keine Typen. Den Typecheck übernimmt das
      # App-Target `build` (browserTarget der Storybook-Targets, tsconfig.json inkl. Stories).
      - name: Typecheck
        run: npm run typecheck
      - name: Storybook bauen
        run: npm run build-storybook
      # Das Manifest ist die Schnittstelle für Agenten/MCP-Clients (addon-mcp,
      # experimentalDocgenServer); ohne dieses Gate fiele ein stilles Wegfallen
      # (z. B. durch ein zukünftiges Storybook-Update oder eine geänderte
      # Addon-Konfiguration) nicht auf.
      - name: Komponenten-Manifest vorhanden
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'storybook-static/manifests/components.json';
            if (!fs.existsSync(path)) {
              console.error('Manifest fehlt: ' + path);
              process.exit(1);
            }
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const docgen = manifest.meta && manifest.meta.docgen;
            if (docgen !== 'angular-component-meta') {
              console.error('meta.docgen erwartet \"angular-component-meta\", war: ' + docgen);
              process.exit(1);
            }
            const count = Object.keys(manifest.components || {}).length;
            if (count < 1) {
              console.error('Manifest enthaelt keine Komponenten-Eintraege');
              process.exit(1);
            }
            console.log('Manifest ok: docgen=' + docgen + ', Eintraege=' + count);
          "
      - name: Playwright-Browser installieren
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      # Vitest (@storybook/addon-vitest, Browser-Mode via Playwright/Chromium)
      # führt jede Story als Test aus (Smoke + axe-a11y + play), direkt aus der
      # Quelle — kein statischer Build/Server nötig. Ersetzt den bisherigen
      # Storybook-Test-Runner (Jest), der dieselben Stories redundant ein
      # zweites Mal fuhr (siehe docs/adr/0005). Ohne VISUAL=1 keine
      # Bildvergleiche; die laufen gepinnt in .github/workflows/visual.yml.
      - name: Storybook-Tests (Vitest)
        run: npm run test:vitest
      # Kontrast-Gate der Doku-Seite. Hängt hier und nicht in css-core.yml, weil es einen
      # Browser braucht: das Wurzelprojekt bleibt absichtlich ohne Dependencies, Playwright
      # lebt in diesem Workspace und ist eine Zeile weiter oben schon installiert.
      - name: Kontrast-Gate (Doku, beide Modi)
        working-directory: .
        # PLAYWRIGHT_BROWSERS_PATH=0 wie beim Install oben: der Browser liegt dann im
        # playwright-core-Paket selbst, das Skript findet ihn von der Wurzel aus.
        run: PLAYWRIGHT_BROWSERS_PATH=0 npm run check:contrast
      # Unbedingt (nicht nur auf main) hochladen: der mcp-smoke-test-Job unten braucht denselben
      # Storybook-Build bei jedem PR und Push, um manifests/ + services/ in den MCP-Snapshot zu
      # kopieren (ADR-0012). Der Pages-Artefakt zwei Steps weiter unten eignet sich dafür nicht:
      # er entsteht nur bedingt (nur auf main, nur bei push/workflow_dispatch), liegt in einem
      # für actions/deploy-pages reservierten Format und würde den Smoke-Test bei jedem PR ohne
      # Grundlage dastehen lassen. Kurze Aufbewahrung, weil es ein reines Zwischenartefakt für
      # denselben Workflow-Lauf ist.
      - name: Storybook-Build für MCP-Snapshot hochladen
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-angular/storybook-static
          retention-days: 1
      # Nur hochladen, wenn danach auch tatsächlich deployt wird — dieselbe
      # Bedingung wie im deploy-Job. Sonst läge bei jedem PR ein ungenutztes
      # Pages-Artefakt herum. Auch der manuelle Trigger zählt nur auf main:
      # workflow_dispatch nimmt jeden Branch an, und Pages zeigt laut ADR-0009
      # immer den Stand von main, nie einen ungemergten Branch.
      - name: Storybook-Build als Pages-Artefakt hochladen
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-angular/storybook-static

  # MCP-Server-Tarball-Smoke-Test (ADR-0012): baut aus demselben Storybook-Build wie oben (kein
  # zweiter build-storybook-Lauf) den Snapshot des @conciso/design-system-mcp-Pakets, tarballt es
  # per `npm pack` und installiert genau dieses Tarball in ein frisches Verzeichnis — wie ein
  # Consumer es täte —, um dort über stdio rohes JSON-RPC gegen `cds-mcp` zu sprechen
  # (mcp-server/scripts/smoke-test.mjs). Läuft bei jedem PR und Push (kein `if:`, folgt also
  # `verify`s eigenen Trigger-Bedingungen), unabhängig vom Pages-Deploy — deploy bleibt bewusst
  # nur von `verify` abhängig, nicht zusätzlich hiervon.
  mcp-smoke-test:
    name: MCP-Server — Tarball-Smoke-Test über stdio
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm-Workspace wie im verify-Job → vom Repo-Root installieren.
      - name: Dependencies installieren
        run: npm ci
      - name: Storybook-Build aus dem verify-Job herunterladen
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-angular/storybook-static
      - name: MCP-Snapshot bauen
        run: npm run build:snapshot -w mcp-server
      # Unit-Tests des Pakets (test/*.test.mjs, braucht den Snapshot direkt eben gebaut) und der
      # Eval-Checker-Logik (eval/checker.test.mjs, bewusst getrennt gehalten von `npm test`,
      # siehe Kommentar in eval/checker.test.mjs — braucht den Snapshot NICHT, arbeitet mit
      # handgepflegten Fixtures).
      - name: Unit-Tests (mcp-server)
        run: npm test -w mcp-server
      - name: Eval-Checker-Tests (mcp-server)
        run: npm run test:eval-checker -w mcp-server
      # Tarball packen und Smoke-Test über stdio fahren: EIN Skript-Aufruf statt des Shell-Blocks
      # „npm pack … find die eine .tgz … smoke-test.mjs“, der hier und in publish.yml früher
      # doppelt gepflegt wurde (siehe test-support/tarball.mjs). Ohne Pfad-Argument packt
      # smoke-test.mjs sich selbst; anders als publish.yml braucht dieser Job den Tarball-Pfad
      # danach nicht weiter.
      - name: Tarball packen und Smoke-Test über stdio fahren
        run: node mcp-server/scripts/smoke-test.mjs

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Zusätzlicher, job-scoped Concurrency-Kanal: serialisiert Deploys auch
    # zwischen Push- und manuellen Läufen, ohne einen laufenden abzubrechen.
    # Den Schutz vor dem Workflow-weiten Abbruch liefert er NICHT — der kommt
    # aus der bedingten cancel-in-progress-Regel oben.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
