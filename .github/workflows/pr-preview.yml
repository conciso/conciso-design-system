name: PR-Vorschau (Doku)

# Baut pro PR eine offline lauffähige Vorschau der Design-System-Doku als
# Download-Artefakt „doku-preview" (kein Admin/SaaS nötig, läuft auch auf
# privatem Repo). Ein Bot-Kommentar am PR erklärt den Download.
# Reviewer: Artefakt laden → entpacken → index.html doppelklicken.
#
# Eine früher hier vorbereitete Live-Vorschau pro PR (gh-pages-Branch via
# rossjrw/pr-preview-action) wurde entfernt: Die Pages-Site des Repos wird
# jetzt über deploy-pages.yml mit der Quelle „GitHub Actions" veröffentlicht,
# was „Deploy from a branch" — und damit den gh-pages-Ansatz — ausschließt.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'css/**'
      - 'fonts/**'
      - 'tokens/**'
      - 'dist/**'
      - 'icons/**'
      - 'scripts/build-docs-preview.sh'
      - '.github/workflows/pr-preview.yml'

permissions:
  contents: read
  pull-requests: write   # Vorschau-Kommentar

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Doku-Vorschau bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick sicherstellen
        run: mogrify -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y imagemagick; }

      - name: Vorschau bauen
        run: bash scripts/build-docs-preview.sh "$GITHUB_WORKSPACE/_preview"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: doku-preview
          path: _preview
          retention-days: 14

      - name: Vorschau-Kommentar (Artefakt)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- doku-preview-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### 📄 Doku-Vorschau bereit',
              '',
              'Eine **offline lauffähige** Vorschau dieser Änderung liegt als Download bereit:',
              '',
              `1. [Diesen Workflow-Lauf öffnen](${runUrl}) und ganz unten zu **Artifacts** scrollen.`,
              '2. **`doku-preview`** herunterladen und das Zip entpacken.',
              '3. **`index.html`** per Doppelklick öffnen — rendert vollständig offline (Schriften, Bilder, Navigation).',
              '4. Links auf **Inputs & Forms** klicken → unter **Feldkomponenten** ist die Änderung sichtbar.',
              '',
              '_Wird bei jedem Push automatisch aktualisiert._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
